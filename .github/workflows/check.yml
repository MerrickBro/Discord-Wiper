name: Validate extension

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Test core and validate extension
        run: |
          npm test
          npm run check
          npm run package
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Test the packaged extension against mocked Discord
        env:
          WIPER_EXTENSION_PATH: ${{ github.workspace }}/test-results/package/merrick-discord-wiper
          WIPER_ARTIFACTS_DIR: ${{ github.workspace }}/test-results/screenshots
        run: |
          releaseVersion="$(node -p "require('./extension/manifest.json').version")"
          python3 -m zipfile -e "dist/merrick-discord-wiper-${releaseVersion}.zip" test-results/package
          node scripts/browserSmoke.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: extension-and-browser-results
          path: |
            dist/*.zip
            test-results/screenshots/*.png
          if-no-files-found: ignore
